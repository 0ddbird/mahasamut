<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scriptomancy — Games to read the world's scripts</title>
    <meta
      name="description"
      content="Short games to learn to read Thai, with Chinese, Japanese, Korean and Vietnamese to come. Sounds are written in the International Phonetic Alphabet, and played aloud."
    />
    <link rel="canonical" href="https://scriptomancy.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scriptomancy" />
    <meta property="og:title" content="Scriptomancy — Games to read the world's scripts" />
    <meta
      property="og:description"
      content="Short games to learn to read Thai, with Chinese, Japanese, Korean and Vietnamese to come."
    />
    <meta property="og:url" content="https://scriptomancy.com/" />
    <meta property="og:image" content="https://scriptomancy.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Scriptomancy",
        "url": "https://scriptomancy.com/",
        "description": "Games to read the world's scripts: Thai today, Chinese, Japanese, Korean and Vietnamese to come.",
        "inLanguage": "en"
      }
    </script>

    <link rel="stylesheet" href="./home.scss" />
  </head>
  <body>
    <main class="page">
      <h1 class="logo">Scriptomancy</h1>
      <p class="tagline">Games to read the world's scripts</p>

      <ul class="tiles">
        <li class="tile" data-language="thai">
          <a class="card" href="https://thai.scriptomancy.com">
            <span class="art">
              <span class="shape">
                <img
                  src="./tiles/thai.webp"
                  width="572"
                  height="1024"
                  alt="Thai: a watercolour of a waterfall in a misty jungle, falling between palms and bamboo into a green river"
                />
              </span>
              <span class="native" lang="th">ภาษาไทย</span>
            </span>
            <span class="name">Thai</span>
          </a>
        </li>
        <li class="tile soon" data-language="chinese">
          <div class="card">
            <span class="art">
              <span class="shape">
                <img
                  src="./tiles/chinese.webp"
                  width="572"
                  height="1024"
                  loading="lazy"
                  alt="Chinese: a watercolour of a quiet river winding through reeds towards steep, misty karst mountains"
                />
              </span>
              <span class="native" lang="zh-Hans">中文</span>
            </span>
            <span class="name">Chinese</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
        <li class="tile soon" data-language="japanese">
          <div class="card">
            <span class="art">
              <span class="shape">
                <img
                  src="./tiles/japanese.webp"
                  width="572"
                  height="1024"
                  loading="lazy"
                  alt="Japanese: a watercolour of Mount Fuji under snow, behind a five-storey pagoda and branches of cherry blossom"
                />
              </span>
              <span class="native" lang="ja">日本語</span>
            </span>
            <span class="name">Japanese</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
        <li class="tile soon" data-language="korean">
          <div class="card">
            <span class="art">
              <span class="shape">
                <img
                  src="./tiles/korean.webp"
                  width="572"
                  height="1024"
                  loading="lazy"
                  alt="Korean: a watercolour of a pavilion and a stone bridge by a pond, under rocky mountains in autumn colours"
                />
              </span>
              <span class="native" lang="ko">한국어</span>
            </span>
            <span class="name">Korean</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
        <li class="tile soon" data-language="vietnamese">
          <div class="card">
            <span class="art">
              <span class="shape">
                <img
                  src="./tiles/vietnamese.webp"
                  width="572"
                  height="1024"
                  loading="lazy"
                  alt="Vietnamese: a watercolour of limestone islands rising from a calm green bay, seen through trees"
                />
              </span>
              <span class="native" lang="vi">Tiếng Việt</span>
            </span>
            <span class="name">Vietnamese</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
      </ul>
    </main>
    <footer class="footer">© 2026 Scriptomancy</footer>
  </body>
</html>
