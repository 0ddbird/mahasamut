<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scriptomancy — Games to read the world's scripts</title>
    <meta
      name="description"
      content="Short games to learn to read Thai, with Chinese, Japanese, Korean and Vietnamese to come. Sounds are written in the International Phonetic Alphabet, and played aloud."
    />
    <link rel="canonical" href="https://scriptomancy.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scriptomancy" />
    <meta property="og:title" content="Scriptomancy — Games to read the world's scripts" />
    <meta
      property="og:description"
      content="Short games to learn to read Thai, with Chinese, Japanese, Korean and Vietnamese to come."
    />
    <meta property="og:url" content="https://scriptomancy.com/" />
    <meta property="og:image" content="https://scriptomancy.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Scriptomancy",
        "url": "https://scriptomancy.com/",
        "description": "Games to read the world's scripts: Thai today, Chinese, Japanese, Korean and Vietnamese to come.",
        "inLanguage": "en"
      }
    </script>

    <link rel="stylesheet" href="./home.scss" />
  </head>
  <body>
    <main class="page">
      <h1 class="logo">Scriptomancy</h1>
      <p class="tagline">Games to read the world's scripts</p>

      <ul class="tiles">
        <li class="tile" data-language="thai">
          <a class="card" href="https://thai.scriptomancy.com">
            <span class="shape">
              <img
                src="./tiles/thai.webp"
                width="274"
                height="718"
                alt="Thai: a wooden stilt house by a pond at dusk, and an open book glowing on a carved table, under the title ภาษาไทย"
              />
            </span>
            <span class="name">Thai</span>
          </a>
        </li>
        <li class="tile soon" data-language="chinese">
          <div class="card">
            <span class="shape">
              <img
                src="./tiles/chinese.webp"
                width="274"
                height="718"
                loading="lazy"
                alt="Chinese: bamboo through a round moon window, and a brush stroke rising from a scroll, under the title 中文"
              />
            </span>
            <span class="name">Chinese</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
        <li class="tile soon" data-language="japanese">
          <div class="card">
            <span class="shape">
              <img
                src="./tiles/japanese.webp"
                width="274"
                height="718"
                loading="lazy"
                alt="Japanese: a red torii gate before Mount Fuji, with cherry blossoms and stone steps, under the title 日本語"
              />
            </span>
            <span class="name">Japanese</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
        <li class="tile soon" data-language="korean">
          <div class="card">
            <span class="shape">
              <img
                src="./tiles/korean.webp"
                width="274"
                height="718"
                loading="lazy"
                alt="Korean: an open book glowing at night beside a palace roof, with a tower and autumn trees, under the title 한국어"
              />
            </span>
            <span class="name">Korean</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
        <li class="tile soon" data-language="vietnamese">
          <div class="card">
            <span class="shape">
              <img
                src="./tiles/vietnamese.webp"
                width="274"
                height="718"
                loading="lazy"
                alt="Vietnamese: a small boat with a lantern among limestone peaks in the rain, under the title Tiếng Việt"
              />
            </span>
            <span class="name">Vietnamese</span>
            <span class="note">Coming soon</span>
          </div>
        </li>
      </ul>
    </main>
    <footer class="footer">© 2026 Scriptomancy</footer>
  </body>
</html>
