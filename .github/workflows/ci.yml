name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Run test suite (Vitest)
        run: npm test

      - name: Typecheck and build client
        run: npm run build

      - name: Build server bundle
        run: npm run build:server
